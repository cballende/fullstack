<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    
    <h1>Hola, mundo</h1>
    <p>Este es un sitio servido desde un servidor estatico</p>

    <h2>Lista de canciones</h2>
    <ul id="tracks-list"></ul>

    <!--GET BY ID-->
    <h2>BUSCAR cliente por Id</h2>
    <input type="number" id="getIdinput" placeholder="Ingrese ID del cliente">
    <button id="getId">Buscar</button>
    <p id="getResult"></p>
    
    <!--DELETE BY ID-->
    <h2>ELIMINAR cliente por Id</h2>
    <input type="number" id="inputDeleteId" placeholder="Ingrese ID del cliente a eliminar">
    <button id="deleteId">Eliminar</button>
    <p id="deleteResult"></p>
    
    <!--CREAR CLIENTE-->
    <h2>CREAR Cliente</h2>
    <input type="text" id="nombre" placeholder="Nombre"><br>
    <input type="text" id="apellido" placeholder="Apellido"><br>
    <input type="text" id="direccion" placeholder="Direccion"><br>
    <input type="text" id="activo" placeholder="Activo"><br>
    <button id="createBtn">Crear</button>
     <p id="createResult"></p>

    <!--UPDATE CLIENTE-->
    <h2>ACTUALIZAR Cliente</h2>
    <select name="update_cliente" id="select_update" class="update_input">        
    </select>
    <br>
    <input type="hidden" id="id_update"   class="update_input" >
    <input type="text" id="nombre_update"   class="update_input" placeholder="Nombre"><br>
    <input type="text" id="apellido_update" class="update_input" placeholder="Apellido"><br>
    <input type="text" id="direccion_update"class="update_input" placeholder="Direccion"><br>
    <input type="text" id="activo_update"   class="update_input" placeholder="Activo"><br>
    <button id="updateBtn">Actualizar</button>
     <p id="updateResult"></p>

    <!--UPDATE FACTURA-->
    <h2>ACTUALIZAR Factura</h2>
    <select name="update_factura" id="select_update_factura" class="update_factura_input">        
    </select>
    <br>
    <input type="hidden" id="id_update_factura"     class="update_factura_input" >
    <input type="text" id="nombre_update_factura"   class="update_factura_input" placeholder="Nombre"><br>
    <input type="text" id="apellido_update_factura" class="update_factura_input" placeholder="Apellido"><br>
    <input type="text" id="direccion_update_factura"class="update_factura_input" placeholder="Direccion"><br>
    <input type="text" id="activo_update_factura"   class="update_factura_input" placeholder="Activo"><br>
    <button id="updateFacturaBtn">Actualizar</button>
     <p id="updateFacturaResult"></p>
     
    <!--UPDATE PRODUCTO-->
    <h2>ACTUALIZAR Producto</h2>
    <select name="update_producto" id="select_update_producto" class="update_producto_input">        
    </select>
    <br>
    <input type="hidden" id="id_update_producto"     class="update_producto_input" >
    <input type="text" id="nombre_update_producto"   class="update_producto_input" placeholder="Nombre"><br>
    <input type="text" id="apellido_update_producto" class="update_producto_input" placeholder="Apellido"><br>
    <input type="text" id="direccion_update_producto"class="update_producto_input" placeholder="Direccion"><br>
    <input type="text" id="activo_update_producto"   class="update_producto_input" placeholder="Activo"><br>
    <button id="updateProductoBtn">Actualizar</button>
     <p id="updateProductoResult"></p> 

    <script src="index.js"></script>
    <script src="main.js"></script>
</body>
</html>
